name: postgres-queuing-lab
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab-local-only
      POSTGRES_DB: lab
    command: ["postgres", "-c", "max_connections=50", "-c", "statement_timeout=60000", "-c", "log_min_duration_statement=250"]
    ports: ["127.0.0.1:55439:5432"]
    cpus: 2
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 2s
      timeout: 2s
      retries: 30
  pgbouncer:
    build:
      context: .
      dockerfile: lab/Dockerfile.pgbouncer
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["127.0.0.1:56439:6432"]
    cpus: 0.5
    mem_limit: 128m
  api:
    build: .
    environment:
      PGHOST: ${DB_HOST:-pgbouncer}
      PGPORT: ${DB_PORT:-6432}
      PGUSER: lab
      PGPASSWORD: lab-local-only
      PGDATABASE: lab
      POOL_MAX: ${POOL_MAX:-10}
      ACQUIRE_TIMEOUT_MS: ${ACQUIRE_TIMEOUT_MS:-15000}
    depends_on:
      postgres: {condition: service_healthy}
      pgbouncer: {condition: service_started}
    # Docker chooses a free host port for each replica; the load script discovers it.
    ports: ["127.0.0.1::3000"]
    cpus: ${API_CPUS:-1}
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
  rust-api:
    profiles: ["rust"]
    build:
      context: .
      dockerfile: rust-lab/Dockerfile
    environment:
      PGHOST: pgbouncer
      PGPORT: 6432
      PGUSER: lab
      PGPASSWORD: lab-local-only
      PGDATABASE: lab
      RUST_ASYNC_WORKERS: 2
    depends_on:
      postgres: {condition: service_healthy}
      pgbouncer: {condition: service_started}
    ports: ["127.0.0.1::3000"]
    cpus: 2
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/health"]
      interval: 2s
      timeout: 2s
      retries: 30
  rust-api-one-thread:
    profiles: ["rust"]
    build:
      context: .
      dockerfile: rust-lab/Dockerfile
    environment:
      PGHOST: pgbouncer
      PGPORT: 6432
      PGUSER: lab
      PGPASSWORD: lab-local-only
      PGDATABASE: lab
      RUST_ASYNC_WORKERS: 1
    depends_on:
      postgres: {condition: service_healthy}
      pgbouncer: {condition: service_started}
    ports: ["127.0.0.1::3000"]
    cpus: 2
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/health"]
      interval: 2s
      timeout: 2s
      retries: 30
