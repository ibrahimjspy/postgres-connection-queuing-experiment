[package]
name = "rust-event-loop-lab"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8.9"
deadpool-postgres = "0.14.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "time"] }
tokio-postgres = "0.7.18"
